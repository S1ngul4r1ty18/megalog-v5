# MegaLog — rate limit zones (devem ficar em http{}, fora de server{})
# Instalado em /etc/nginx/conf.d/megalog-ratelimit.conf pelo install.sh.
# Usado no sites-enabled/megalog em locations específicos.

# Auth: 1 req/s por IP, burst de 5 (=máx 6 tentativas em 5s) com nodelay
# para retornar 429 imediatamente em vez de filar.
limit_req_zone $binary_remote_addr zone=megalog_auth:10m rate=1r/s;

# Resposta padrão para excesso (default é 503; 429 é mais correto semanticamente)
limit_req_status 429;
