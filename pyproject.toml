[project]
name = "megalog"
version = "5.0.0a1"
description = "Sistema de auditoria CGNAT — reescrita v5 (DuckDB + Parquet + FastAPI + Vue)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Igor de Andrade Picanço", email = "igor.iapicanco@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "uvloop>=0.21.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
    "psutil>=6.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "radon>=6.0.0",
]

[project.scripts]
megalog-receiver = "megalog.ingest.receiver:main"
megalog-processor = "megalog.ingest.processor:main"
megalog-web = "megalog.api.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["megalog*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
filterwarnings = ["ignore::DeprecationWarning"]
